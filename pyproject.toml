[project]
name = "agentic-ai-portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YusraShereen", email = "yusrashereen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-ai-portfolio = "agentic_ai_portfolio:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
